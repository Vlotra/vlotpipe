name: vlotpipe
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vlotra/vlotpipe@master # vlotpipe: ignore[SEC001] no tagged release exists yet; pin to one once it does
        with:
          # Scan only this repo's real workflows. A plain "." would also
          # sweep testdata/, which is full of deliberately-bad fixtures
          # (hardcoded keys, unpinned actions) that exist to exercise the
          # detection rules — they'd fail this gate on every PR regardless
          # of the diff.
          paths: .github/workflows
          fail-on: blocker
