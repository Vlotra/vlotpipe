name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@f26d0aef3ef145fb0d4288fe62f8747cbcad7387 # v4.0.2
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test
