trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

jobs:
  - job: build
    steps:
      - checkout: self
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.12"
      - script: pip install -r requirements.txt
      - task: AzureCLI@2
        inputs:
          azureSubscription: "my-sub"
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: az account show
        env:
          AZURE_API_KEY: hardcoded-secret-value-123
