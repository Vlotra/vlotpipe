name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        uses: some-org/deploy-action@main
        with:
          api_key: hardcoded-value-123
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
